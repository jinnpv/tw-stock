name: update-companies
on: {workflow_dispatch: {}, push: {paths: [".github/workflows/update-companies.yml", "build_companies.py"]}, schedule: [{cron: "30 1 * * 1-5"}]}
permissions: {contents: write}
jobs: {build: {runs-on: ubuntu-latest, steps: [{uses: "actions/checkout@v4"}, {uses: "actions/setup-python@v5", with: {python-version: "3.11"}}, {name: "Build companies.json", run: "python build_companies.py"}, {name: "Commit", run: "git config user.name github-actions && git config user.email github-actions@users.noreply.github.com && git add companies.json && (git diff --cached --quiet || git commit -m 'Update companies.json') && git push"}]}}
