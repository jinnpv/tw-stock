<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>台股即時報價</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --sheet:#FFFFFF; --ink:#16222E; --muted:#68757F; --line:#DCE2E8;
  --accent:#2457D6; --up:#D4332C; --down:#0F8F5D; --ma5:#C98A00; --grid:#E3E8ED;
  --hdr:calc(env(safe-area-inset-top) + 52px);
  --bar:calc(env(safe-area-inset-bottom) + 56px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E151C; --sheet:#141D26; --ink:#E8EDF2; --muted:#8C99A5; --line:#25313D;
    --accent:#7FA2FF; --up:#FF6B63; --down:#3CC48A; --ma5:#E8B84A; --grid:#202C37;
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
button{font:inherit; color:inherit}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}

header{
  position:sticky; top:0; z-index:6; background:var(--bg); height:var(--hdr);
  padding:env(safe-area-inset-top) 14px 0 14px;
  display:flex; justify-content:space-between; align-items:center; gap:12px;
}
h1{font-size:18px; font-weight:700; margin:0}
.status{
  display:flex; align-items:center; gap:8px; background:none; border:0; color:var(--muted);
  font-size:13px; padding:6px 0 6px 8px; cursor:pointer;
}
.status b{color:var(--ink); font-weight:500}
.dot{width:8px; height:8px; border-radius:50%; background:var(--muted)}
.live .dot{background:var(--accent)}
.status time{font-variant-numeric:tabular-nums}

.main{padding-bottom:calc(var(--bar) + 28px); min-height:calc(100vh - var(--hdr))}
.hint{margin:0; padding:56px 24px; text-align:center; color:var(--muted); line-height:1.8}
.vh{display:flex; align-items:center; gap:10px; padding:2px 12px 10px; font-size:12.5px; color:var(--muted)}
.vh b{color:var(--ink); font-size:16px}
.vh .sp{flex:1}
.back{background:none; border:0; color:var(--accent); font-size:15px; padding:6px 8px 6px 0; cursor:pointer}

form{display:flex; gap:8px; padding:0 12px 10px}
input{
  flex:1; min-width:0; height:42px; padding:0 12px; border:1px solid var(--line);
  border-radius:8px; background:var(--sheet); color:var(--ink); font:inherit; font-size:16px;
}
input::placeholder{color:var(--muted)}
.add{height:42px; padding:0 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:700; cursor:pointer}
@media (prefers-color-scheme: dark){ .add{color:#0E151C} }
.notice{margin:0 12px 8px; font-size:13px; color:var(--up)}
.notice:empty{display:none}

/* 底部分頁列 */
.bar{
  position:fixed; left:0; right:0; bottom:0; z-index:8; display:flex;
  background:var(--sheet); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.bar button{
  flex:1; height:56px; background:none; border:0; cursor:pointer; color:var(--muted);
  font-size:15px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.25;
}
.bar button small{font-size:11px; color:var(--muted)}
.bar button[aria-current="true"]{color:var(--ink); font-weight:700; box-shadow:inset 0 2px 0 var(--accent)}

/* 產業／族群清單 */
.glist{background:var(--sheet); border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.grow{
  display:flex; justify-content:space-between; align-items:center; gap:12px; width:100%; text-align:left;
  background:none; border:0; border-bottom:1px solid var(--line); padding:15px 14px; cursor:pointer; font-size:16px;
}
.grow:last-child{border-bottom:0}
.grow span{color:var(--muted); font-size:13px; white-space:nowrap}
.gempty{padding:28px 16px; color:var(--muted); text-align:center}

/* 一排兩檔 */
.grid{
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-auto-flow:row dense;
  gap:1px; background:var(--line);
  border-top:1px solid var(--line); border-bottom:1px solid var(--line);
}
.card{
  background:var(--sheet); padding:10px 10px 10px 12px; min-width:0; cursor:pointer;
  display:flex; flex-direction:column; gap:3px; -webkit-tap-highlight-color:transparent;
}
.card[aria-expanded="true"]{box-shadow:inset 0 -2px 0 var(--accent)}
.top{display:flex; align-items:center; gap:6px; min-width:0}
.n{font-weight:700; font-size:15.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.lead{
  flex:none; font-size:10.5px; line-height:1; padding:3px 4px; border-radius:4px;
  color:var(--accent); border:1px solid var(--accent); font-weight:500;
}
.sub{display:flex; gap:6px; min-width:0; font-size:12px; color:var(--muted)}
.sub .c{flex:none; font-variant-numeric:tabular-nums}
.sub .i{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.mid{display:flex; justify-content:space-between; align-items:center; gap:6px; margin-top:4px}
.px{font:600 24px/1.05 "IBM Plex Sans","Noto Sans TC",system-ui,sans-serif; font-variant-numeric:tabular-nums; letter-spacing:-.01em; min-width:0}
.px.sm{font-size:19px}
.chg{font-size:12.5px; line-height:1.3; font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.candle{flex:none; width:26px; height:62px; display:block; overflow:visible}
.candle .base{stroke:var(--muted); stroke-width:1; stroke-dasharray:2 2; opacity:.8}
.candle .wick{stroke-width:1.6}
.candle .wick.up{stroke:var(--up)} .candle .wick.down{stroke:var(--down)} .candle .wick.flat{stroke:var(--muted)}
.candle .body.up{fill:var(--up)} .candle .body.down{fill:var(--down)} .candle .body.flat{fill:var(--muted)}
.hold{color:var(--muted); font-size:13px; padding:6px 0}

/* 點開個股：日K */
.detail{grid-column:1 / -1; background:var(--sheet); padding:8px 12px 14px}
.kinfo{min-height:40px; font-size:12.5px; line-height:1.45; color:var(--muted); font-variant-numeric:tabular-nums}
.kinfo b{color:var(--ink); font-weight:500}
.kchart{display:block; width:100%; height:auto; touch-action:pan-y; user-select:none; -webkit-user-select:none}
.kchart .grid{stroke:var(--grid); stroke-width:1}
.kchart text{fill:var(--muted); font-size:10px; font-family:inherit}
.kchart .w.up{stroke:var(--up)} .kchart .w.down{stroke:var(--down)} .kchart .w.flat{stroke:var(--muted)}
.kchart .b.up{fill:var(--up)} .kchart .b.down{fill:var(--down)} .kchart .b.flat{fill:var(--muted)}
.kchart .v.up{fill:var(--up); opacity:.55} .kchart .v.down{fill:var(--down); opacity:.55} .kchart .v.flat{fill:var(--muted); opacity:.55}
.kchart .ma{fill:none; stroke-width:1.2; stroke-linejoin:round}
.kchart .ma5{stroke:var(--ma5)} .kchart .ma20{stroke:var(--accent)}
.kchart .cross{stroke:var(--muted); stroke-width:1; stroke-dasharray:3 3}
.klegend{display:flex; gap:14px; font-size:11.5px; color:var(--muted); margin:2px 0 10px}
.klegend i{display:inline-block; width:12px; height:2px; vertical-align:middle; margin-right:5px}
.kmsg{padding:34px 8px; text-align:center; color:var(--muted); font-size:13px}
.facts{display:grid; grid-template-columns:repeat(3,1fr); gap:6px 10px; margin:0 0 4px; font-size:13px; font-variant-numeric:tabular-nums}
.facts div{display:flex; flex-direction:column}
.facts dt{color:var(--muted); font-size:12px}
.facts dd{margin:0; font-weight:500}
.act{margin-top:10px; background:none; border:0; padding:6px 0; color:var(--accent); font-size:13.5px; text-decoration:underline; cursor:pointer}
.act.rm{color:var(--muted)}
.more{display:block; width:calc(100% - 24px); margin:12px; height:42px; border:1px solid var(--line); border-radius:8px; background:var(--sheet); cursor:pointer}
.empty{grid-column:1 / -1; background:var(--sheet); padding:28px 16px; color:var(--muted); text-align:center}
.foot{margin:12px 12px 0; font-size:12px; color:var(--muted)}
.bar button{font-size:14.5px}
.seg{display:flex; margin:2px 0 8px}
.seg button{flex:1; height:32px; background:none; border:1px solid var(--line); color:var(--muted); font-size:13px; cursor:pointer}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0; border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700}
@media (prefers-color-scheme: dark){ .seg button[aria-pressed="true"]{color:#0E151C} }
.kchart .xmark{fill:var(--up); stroke:var(--sheet); stroke-width:1.2}
.scan{margin:0; padding:0 12px 10px; font-size:12.5px; line-height:1.6; color:var(--muted)}
.xmini{display:block; width:100%; height:auto; margin-top:4px}
.xmini .xp{fill:none; stroke:var(--muted); stroke-width:1; opacity:.75}
.xmini .x5{fill:none; stroke:var(--ma5); stroke-width:1.4}
.xmini .x20{fill:none; stroke:var(--accent); stroke-width:1.4}
.xmini .xdot{fill:var(--up); stroke:var(--sheet); stroke-width:1.5}
.xinfo{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.xinfo b{color:var(--up); font-weight:500}
</style>
</head>
<body>
<header>
  <h1>台股即時報價</h1>
  <button class="status" id="status" type="button" title="立即更新">
    <span class="dot"></span><b id="mkt">—</b><time id="upd"></time>
  </button>
</header>

<div class="main">
  <p class="hint" id="hint">點下方的「自選」「產業別」「概念族群」或「5穿20」<br>展開來看個股</p>
  <div class="vh" id="vh" hidden></div>
  <p class="scan" id="scan" hidden></p>
  <form id="add" autocomplete="off" hidden>
    <input id="code" inputmode="text" enterkeyhint="done" placeholder="輸入代號，例如 2330" aria-label="股票代號">
    <button class="add" type="submit">加入</button>
  </form>
  <p class="notice" id="notice" role="status"></p>
  <div class="glist" id="glist" hidden></div>
  <main class="grid" id="list" hidden></main>
  <button class="more" id="more" type="button" hidden>顯示更多</button>
  <p class="foot" id="foot" hidden>卡片上的 K 棒是今天的日 K：實體為開盤到目前成交價，細線為最高最低，虛線為昨收。點個股可看近 60 個交易日的日 K。「龍頭」是同產業市值最大的公司（發行股數 × 最近收盤價）。</p>
</div>

<nav class="bar" id="bar" aria-label="分類">
  <button type="button" data-tab="watch">自選</button>
  <button type="button" data-tab="industry">產業別</button>
  <button type="button" data-tab="concept">概念族群</button>
  <button type="button" data-tab="cross">5穿20</button>
</nav>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const KEY = 'tw_watchlist_v1';
  const DEFAULT = ['t00', '2330', '2317'];
  const PAGE = 40;
  const NAMES = {watch: '自選', industry: '產業別', concept: '概念族群', cross: '5穿20'};
  const norm = c => c.toLowerCase() === 't00' ? 't00' : c.toUpperCase();
  const key = c => c.toLowerCase();

  function loadList() {
    try { const v = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(v)) return v.map(norm); } catch (e) {}
    return DEFAULT.slice();
  }
  function saveList() { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} }

  let list = loadList();
  let tab = null;            // null | 'watch' | 'industry' | 'concept'
  let group = null;          // 目前點開的產業／族群 id
  let groups = {concept: [], industry: [], ready: false};
  let groupTries = 0;
  let quotes = {}, kline = {}, k5 = {}, kmode = {}, scrub = {};
  let scanState = null, scanErr = '', scanTimer = null;
  let missing = new Set();
  const open = new Set();
  let shown = PAGE;
  let err = '', lastOk = null;

  function h(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  const NS = 'http://www.w3.org/2000/svg';
  function sv(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  /* ---------- 格式 ---------- */
  const p2 = n => n == null ? '—' : n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const int = n => n == null ? '—' : n.toLocaleString('en-US');
  function px(n, code) {
    if (n == null) return '—';
    if (code && code.toLowerCase() === 't00') return p2(n);
    if (n >= 100) return String(parseFloat(n.toFixed(2)));
    return n.toFixed(2);
  }
  const dir = n => n > 0 ? 'up' : n < 0 ? 'down' : 'flat';
  const sgn = n => n > 0 ? '+' : n < 0 ? '-' : '';

  /* ---------- 時間 ---------- */
  function twParts(d = new Date()) {
    const f = new Intl.DateTimeFormat('en-US', {
      timeZone: 'Asia/Taipei', weekday: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });
    const o = {};
    f.formatToParts(d).forEach(p => o[p.type] = p.value);
    return o;
  }
  function isOpen() {
    const o = twParts();
    if (o.weekday === 'Sat' || o.weekday === 'Sun') return false;
    const m = (+o.hour % 24) * 60 + +o.minute;
    return m >= 540 && m <= 810;
  }
  function clock(d) {
    const o = twParts(d);
    return `${String(+o.hour % 24).padStart(2, '0')}:${o.minute}:${o.second}`;
  }

  /* ---------- 目前檢視 ---------- */
  const groupSet = () => tab === 'industry' ? groups.industry : tab === 'concept' ? groups.concept : [];
  const curGroup = () => group ? groupSet().find(g => g.id === group) : null;
  const showingStocks = () => tab === 'watch' || tab === 'cross' || (tab && curGroup());
  const hitList = () => (scanState && scanState.hits) || [];
  function viewCodes() {
    if (tab === 'watch') return list;
    if (tab === 'cross') return hitList().map(x => x.code);
    const g = curGroup();
    return g ? g.codes : [];
  }
  function visible() {
    if (tab === 'watch') return list.slice();
    if (tab === 'cross') return hitList().map(x => x.code);
    const g = curGroup();
    if (!g) return [];
    const rows = g.codes.filter(c => !missing.has(key(c)));
    rows.sort((a, b) => {
      const qa = quotes[key(a)], qb = quotes[key(b)];
      const pa = qa && qa.pct != null ? qa.pct : -1e9, pb = qb && qb.pct != null ? qb.pct : -1e9;
      return pb - pa;
    });
    return rows.slice(0, shown);
  }
  function indInfo(q) { return q.industry ? {industry: q.industry, leader: !!q.leader} : {}; }

  /* ---------- 5穿20 迷你圖 ---------- */
  function crossChart(hit) {
    const W = 180, H = 56, SLOTS = 54;
    const svg = sv('svg', {viewBox: `0 0 ${W} ${H}`, class: 'xmini', 'aria-hidden': 'true'});
    const vals = [].concat(hit.c, hit.m5, hit.m20).filter(v => v != null);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (hi - lo < 1e-9) { hi += 0.5; lo -= 0.5; }
    const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
    const X = i => i / (SLOTS - 1) * W, Y = v => H - (v - lo) / (hi - lo) * H;
    const line = (arr, c) => {
      const pts = [];
      arr.forEach((v, i) => { if (v != null) pts.push(`${X(i).toFixed(1)},${Y(v).toFixed(1)}`); });
      if (pts.length > 1) svg.append(sv('polyline', {points: pts.join(' '), class: c}));
    };
    line(hit.c, 'xp'); line(hit.m20, 'x20'); line(hit.m5, 'x5');
    const v = hit.m5[hit.idx];
    if (v != null) svg.append(sv('circle', {cx: X(hit.idx), cy: Y(v), r: 3.6, class: 'xdot'}));
    return svg;
  }

  /* ---------- 卡片上的今日 K 棒 ---------- */
  function candle(q) {
    const W = 26, H = 62;
    const svg = sv('svg', {viewBox: `0 0 ${W} ${H}`, class: 'candle', 'aria-hidden': 'true'});
    if (q.open == null || q.high == null || q.low == null || q.price == null) return svg;
    let lo = Math.min(q.low, q.prev != null ? q.prev : q.low);
    let hi = Math.max(q.high, q.prev != null ? q.prev : q.high);
    if (hi - lo < 1e-9) { lo -= 0.5; hi += 0.5; }
    const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
    const y = v => (H - ((v - lo) / (hi - lo)) * H);
    const cls = q.price > q.open ? 'up' : q.price < q.open ? 'down' : 'flat';
    if (q.prev != null) svg.append(sv('line', {x1: 0, x2: W, y1: y(q.prev), y2: y(q.prev), class: 'base'}));
    svg.append(sv('line', {x1: 13, x2: 13, y1: y(q.high), y2: y(q.low), class: 'wick ' + cls}));
    const top = Math.min(y(q.open), y(q.price));
    const hgt = Math.max(2, Math.abs(y(q.open) - y(q.price)));
    svg.append(sv('rect', {x: 6, width: 14, y: top, height: hgt, rx: 1, class: 'body ' + cls}));
    return svg;
  }

  /* ---------- 點開個股的日 K ---------- */
  function mergedRows(code, q) {
    const st = kline[key(code)];
    const rows = st && st.rows ? st.rows.map(r => r.slice()) : [];
    if (q && q.open != null && q.high != null && q.low != null && q.price != null && q.date) {
      const d = `${q.date.slice(0, 4)}-${q.date.slice(4, 6)}-${q.date.slice(6, 8)}`;
      const today = [d, q.open, q.high, q.low, q.price, q.vol || 0];
      const last = rows.length ? rows[rows.length - 1][0] : '';
      if (last === d) rows[rows.length - 1] = today;
      else if (last < d) rows.push(today);
    }
    return rows;
  }

  function ma(closes, n) {
    return closes.map((_, i) => {
      if (i < n - 1) return null;
      let s = 0;
      for (let j = i - n + 1; j <= i; j++) s += closes[j];
      return s / n;
    });
  }

  const getMode = code => kmode[key(code)] || (tab === 'cross' ? 'min5' : 'day');

  function segEl(code) {
    const mode = getMode(code);
    const seg = h('div', 'seg');
    [['day', '日K'], ['min5', '5分K']].forEach(([m, label]) => {
      const b = h('button', null, label);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(mode === m));
      b.addEventListener('click', e => {
        e.stopPropagation();
        kmode[key(code)] = m;
        if (m === 'min5') ensureK5(code, true); else ensureKline(code);
        render();
      });
      seg.append(b);
    });
    return seg;
  }

  function kBlock(code, q) {
    const wrap = h('div', 'kwrap');
    wrap.append(segEl(code));
    const mode = getMode(code);
    const info = h('div', 'kinfo');
    wrap.append(info);

    let rows, st;
    if (mode === 'min5') { st = k5[key(code)]; rows = st && st.rows ? st.rows : []; }
    else { st = kline[key(code)]; rows = mergedRows(code, q); }
    const what = mode === 'min5' ? '5分K' : '日K';

    if (!rows.length) {
      wrap.append(h('div', 'kmsg', !st || st.state === 'loading' ? what + '載入中…' : what + '載入失敗：' + (st.msg || '原因不明')));
      return wrap;
    }

    const all = rows;
    const closes = all.map(r => r[4]);
    const m5 = ma(closes, 5), m20 = ma(closes, 20);
    let N;
    if (mode === 'min5') {
      const lastDay = all[all.length - 1][0].slice(0, 10);
      let cnt = 0;
      for (let i = all.length - 1; i >= 0 && all[i][0].slice(0, 10) === lastDay; i--) cnt++;
      N = Math.min(all.length, Math.max(cnt, 40), 108);
    } else N = Math.min(all.length, 60);
    const off = all.length - N;
    const view = all.slice(off);

    const W = 360, H = 244, PR = 40, PT = 6, PB = 150, VT = 164, VB = 226;
    const step = (W - PR) / N;
    const bw = Math.max(2, step * 0.62);
    let hi = Math.max(...view.map(r => r[2])), lo = Math.min(...view.map(r => r[3]));
    if (hi - lo < 1e-9) { hi += 0.5; lo -= 0.5; }
    const pad = (hi - lo) * 0.06; hi += pad; lo -= pad;
    const y = v => PT + (hi - v) / (hi - lo) * (PB - PT);
    const vmax = Math.max(1, ...view.map(r => r[5]));
    const X = i => i * step + step / 2;
    const cls = r => r[4] > r[1] ? 'up' : r[4] < r[1] ? 'down' : 'flat';

    const svg = sv('svg', {viewBox: `0 0 ${W} ${H}`, class: 'kchart', 'aria-label': what + '走勢圖'});
    [hi - pad, (hi + lo) / 2, lo + pad].forEach(v => {
      svg.append(sv('line', {x1: 0, x2: W - PR, y1: y(v), y2: y(v), class: 'grid'}));
      const t = sv('text', {x: W - 2, y: y(v) + 3.5, 'text-anchor': 'end'});
      t.textContent = v >= 100 ? v.toFixed(0) : v.toFixed(2);
      svg.append(t);
    });
    view.forEach((r, i) => {
      if (i === 0) return;
      const pr = view[i - 1];
      let label = null;
      if (mode === 'min5') {
        if (r[0].slice(0, 10) !== pr[0].slice(0, 10)) label = r[0].slice(5, 10).replace('-', '/');
        else if (r[0].slice(11, 13) !== pr[0].slice(11, 13)) label = r[0].slice(11, 13) + ':00';
      } else if (r[0].slice(5, 7) !== pr[0].slice(5, 7)) label = (+r[0].slice(5, 7)) + '月';
      if (label) {
        svg.append(sv('line', {x1: X(i) - step / 2, x2: X(i) - step / 2, y1: PT, y2: VB, class: 'grid'}));
        const t = sv('text', {x: X(i) - step / 2 + 2, y: VB + 13});
        t.textContent = label;
        svg.append(t);
      }
    });
    view.forEach((r, i) => {
      const c = cls(r), x = X(i);
      svg.append(sv('line', {x1: x, x2: x, y1: y(r[2]), y2: y(r[3]), class: 'w ' + c, 'stroke-width': 1.2}));
      const top = Math.min(y(r[1]), y(r[4]));
      svg.append(sv('rect', {x: x - bw / 2, y: top, width: bw, height: Math.max(1.2, Math.abs(y(r[1]) - y(r[4]))), class: 'b ' + c}));
      const vh = (r[5] / vmax) * (VB - VT);
      svg.append(sv('rect', {x: x - bw / 2, y: VB - vh, width: bw, height: Math.max(vh, 0.5), class: 'v ' + c}));
    });
    [[m5, 'ma5'], [m20, 'ma20']].forEach(([arr, c]) => {
      const pts = [];
      arr.slice(off).forEach((v, i) => { if (v != null) pts.push(`${X(i).toFixed(1)},${y(v).toFixed(1)}`); });
      if (pts.length > 1) svg.append(sv('polyline', {points: pts.join(' '), class: 'ma ' + c}));
    });
    if (mode === 'min5') {   // 5MA 由下往上穿過 20MA 的位置打一個圓點
      view.forEach((r, i) => {
        const g = off + i;
        if (g >= 1 && m5[g] != null && m20[g] != null && m5[g - 1] != null && m20[g - 1] != null
            && m5[g - 1] <= m20[g - 1] && m5[g] > m20[g]) {
          svg.append(sv('circle', {cx: X(i), cy: y(m5[g]), r: 3.4, class: 'xmark'}));
        }
      });
    }
    const cross = sv('line', {x1: 0, x2: 0, y1: PT, y2: VB, class: 'cross'});
    cross.setAttribute('visibility', 'hidden');
    svg.append(cross);

    const k = key(code) + ':' + mode;
    function showBar(i, fromUser) {
      i = Math.max(0, Math.min(N - 1, i));
      const r = view[i], prev = all[off + i - 1];
      const d = prev ? r[4] - prev[4] : null;
      const c = d == null ? 'flat' : dir(d);
      info.textContent = '';
      info.append(h('b', null, r[0]));
      info.append(h('span', null, `　開 ${px(r[1])}　高 ${px(r[2])}　低 ${px(r[3])}　收 `), h('b', c, px(r[4])));
      if (d != null) info.append(h('span', c, `　${sgn(d)}${p2(Math.abs(d))} (${Math.abs(d / prev[4] * 100).toFixed(2)}%)`));
      info.append(h('span', null, `　量 ${int(r[5])} 張`));
      if (fromUser) {
        scrub[k] = i;
        cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i));
        cross.setAttribute('visibility', 'visible');
      }
    }
    const onMove = e => {
      const rect = svg.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width * W;
      showBar(Math.floor(x / step), true);
    };
    svg.addEventListener('pointerdown', onMove);
    svg.addEventListener('pointermove', onMove);
    svg.addEventListener('click', e => e.stopPropagation());
    const keep = scrub[k];
    if (keep != null && keep < N) showBar(keep, true); else showBar(N - 1, false);
    wrap.append(svg);

    const lg = h('div', 'klegend');
    const a = h('span'); const ai = h('i'); ai.style.background = 'var(--ma5)'; a.append(ai, 'MA5');
    const b = h('span'); const bi = h('i'); bi.style.background = 'var(--accent)'; b.append(bi, 'MA20');
    lg.append(a, b, h('span', null, mode === 'min5' ? `近 ${N} 根 5 分K　紅點＝5MA 上穿 20MA` : `近 ${N} 個交易日　下方為成交量`));
    wrap.append(lg);
    if (st && st.state === 'err') wrap.append(h('div', 'kmsg', '資料更新失敗（' + (st.msg || '原因不明') + '），顯示的是上一次的資料'));
    return wrap;
  }

  async function ensureK5(code, force) {
    const k = key(code);
    const cur = k5[k];
    if (cur && cur.state === 'loading') return;
    if (!force && cur && cur.state === 'ok' && Date.now() - cur.at < 60000) return;
    const keep = cur && cur.rows ? cur.rows : null;
    k5[k] = {state: 'loading', rows: keep};
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 30000);
    try {
      const r = await fetch('/api/kline5?code=' + encodeURIComponent(code), {signal: ctl.signal, cache: 'no-store'});
      const j = await r.json();
      k5[k] = j.ok ? {state: 'ok', rows: j.rows, at: Date.now()} : {state: 'err', msg: j.error, rows: keep};
    } catch (e) {
      k5[k] = {state: 'err', msg: e.name === 'AbortError' ? '逾時' : (e.message || '連線失敗'), rows: keep};
    } finally { clearTimeout(to); }
    render();
  }

  async function ensureKline(code) {
    const k = key(code);
    if (kline[k] && (kline[k].state === 'ok' || kline[k].state === 'loading')) return;
    kline[k] = {state: 'loading'};
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 30000);
    try {
      const r = await fetch('/api/kline?code=' + encodeURIComponent(code), {signal: ctl.signal, cache: 'no-store'});
      const j = await r.json();
      kline[k] = j.ok ? {state: 'ok', rows: j.rows} : {state: 'err', msg: j.error};
    } catch (e) {
      kline[k] = {state: 'err', msg: e.name === 'AbortError' ? '逾時' : (e.message || '連線失敗')};
    } finally { clearTimeout(to); }
    render();
  }

  /* ---------- 卡片 ---------- */
  function actionBtn(code) {
    const k = key(code);
    const inList = list.some(c => key(c) === k);
    if (tab === 'watch') {
      const b = h('button', 'act rm', '從自選移除');
      b.type = 'button';
      b.addEventListener('click', () => {
        list = list.filter(c => key(c) !== k);
        open.delete(k); saveList(); render(); refresh();
      });
      return b;
    }
    const b = h('button', 'act', inList ? '已在自選' : '加入自選');
    b.type = 'button';
    b.disabled = inList;
    b.addEventListener('click', () => {
      if (!list.some(c => key(c) === k)) { list.push(norm(code)); saveList(); }
      notice(code + ' 已加入自選'); render();
    });
    return b;
  }

  function detail(q, code) {
    const box = h('div', 'detail');
    box.append(kBlock(code, q));
    const facts = h('dl', 'facts');
    [['昨收', px(q.prev, q.code)], ['開', px(q.open, q.code)], ['高', px(q.high, q.code)],
     ['低', px(q.low, q.code)], ['漲停', px(q.up, q.code)], ['跌停', px(q.down, q.code)]].forEach(([k, v]) => {
      const d = h('div');
      d.append(h('dt', null, k), h('dd', null, v));
      facts.append(d);
    });
    box.append(facts, actionBtn(code));
    return box;
  }

  function cardEl(code) {
    const k = key(code);
    const q = quotes[k];
    const card = h('div', 'card');
    if (!q) {
      const bad = missing.has(k);
      const top = h('div', 'top'); top.append(h('span', 'n', code));
      card.append(top, h('div', 'hold', bad ? '找不到這個代號' : '讀取中…'));
      if (bad && tab === 'watch') card.append(actionBtn(code));
      return [card];
    }
    const d = dir(q.change || 0);
    card.setAttribute('role', 'button');
    card.tabIndex = 0;
    card.setAttribute('aria-expanded', open.has(k));
    const toggle = () => {
      if (open.has(k)) open.delete(k);
      else { open.add(k); if (getMode(q.code) === 'min5') ensureK5(q.code, true); else ensureKline(q.code); }
      render();
    };
    card.addEventListener('click', toggle);
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });

    const info = indInfo(q);
    const top = h('div', 'top');
    top.append(h('span', 'n', q.name));
    if (info.leader) top.append(h('span', 'lead', '龍頭'));

    const sub = h('div', 'sub');
    sub.append(h('span', 'c', q.code));
    if (info.industry) sub.append(h('span', 'i', info.industry));

    const mid = h('div', 'mid');
    const left = h('div');
    const pxText = px(q.price, q.code);
    left.append(h('div', 'px ' + d + (pxText.length > 6 ? ' sm' : ''), pxText));
    const hit = tab === 'cross' ? hitList().find(x => key(x.code) === k) : null;
    mid.append(left);
    if (!hit) mid.append(candle(q));

    const chg = h('div', 'chg ' + d,
      q.change == null ? '尚無成交'
        : `${sgn(q.change)}${p2(Math.abs(q.change))} (${Math.abs(q.pct).toFixed(2)}%)`);

    card.append(top, sub, mid, chg);
    if (hit) {
      card.append(crossChart(hit));
      const xi = h('div', 'xinfo');
      xi.append(h('b', null, hit.time), ` 5MA 上穿 20MA　${hit.bars_ago === 0 ? '剛發生' : hit.bars_ago + ' 根前'}`);
      card.append(xi);
    }
    const out = [card];
    if (open.has(k)) out.push(detail(q, code));
    return out;
  }

  /* ---------- 畫面 ---------- */
  function notice(msg) { $('#notice').textContent = msg || ''; }

  function render() {
    // 底部分頁
    document.querySelectorAll('#bar button').forEach(b => b.setAttribute('aria-current', String(b.dataset.tab === tab)));

    const hint = $('#hint'), vh = $('#vh'), gl = $('#glist'), list_ = $('#list'), scanEl = $('#scan');
    hint.hidden = tab !== null;
    vh.hidden = tab === null;
    $('#add').hidden = tab !== 'watch';
    const inGroupList = (tab === 'industry' || tab === 'concept') && !curGroup();
    gl.hidden = !inGroupList;
    list_.hidden = !showingStocks();
    $('#foot').hidden = !showingStocks() || tab === 'cross';
    scanEl.hidden = tab !== 'cross';

    vh.textContent = '';
    gl.textContent = '';
    list_.textContent = '';

    if (tab === 'watch') {
      vh.append(h('b', null, '自選'), h('span', 'sp'), h('span', null, list.length + ' 檔'));
    } else if (tab === 'cross') {
      vh.append(h('b', null, '5穿20'), h('span', 'sp'), h('span', null, hitList().length + ' 檔'));
      const sc = scanState;
      let t = '';
      if (!sc) t = scanErr || '掃描中…';
      else if (sc.running) t = `掃描中 ${sc.done}/${sc.total}，結果會陸續出現…`;
      else {
        t = `條件：最近 ${sc.lookback} 根 5 分K 內，5MA 由下往上穿過 20MA（圖中紅點）。掃描範圍：自選＋概念族群＋各產業龍頭，共 ${sc.total} 檔，資料更新 ${sc.updated || '—'}`;
        if (sc.ok_n === 0 && sc.total) t = `5分K資料抓取失敗（${sc.errs.join('；') || '原因不明'}）`;
        else if (sc.fail_n) t += `，其中 ${sc.fail_n} 檔抓取失敗`;
      }
      scanEl.textContent = t;
    } else if (inGroupList) {
      const set = groupSet();
      vh.append(h('b', null, NAMES[tab]), h('span', 'sp'), h('span', null, set.length ? set.length + (tab === 'industry' ? ' 個產業' : ' 個族群') : ''));
      if (!set.length) {
        gl.append(h('div', 'gempty', tab === 'industry'
          ? (groupTries >= 12 ? '產業資料還沒載入，稍後再試' : '載入中…')
          : '還沒有概念族群'));
      }
      set.forEach(g => {
        const b = h('button', 'grow', g.name);
        b.type = 'button';
        b.append(h('span', null, g.codes.length + ' 檔　›'));
        b.addEventListener('click', () => { group = g.id; shown = PAGE; notice(''); render(); window.scrollTo(0, 0); refresh(); });
        gl.append(b);
      });
    } else if (tab) {
      const g = curGroup();
      const back = h('button', 'back', '‹ ' + NAMES[tab]);
      back.type = 'button';
      back.addEventListener('click', () => { group = null; notice(''); render(); window.scrollTo(0, 0); });
      vh.append(back, h('b', null, g.name), h('span', 'sp'), h('span', null, `共 ${g.codes.length} 檔・依漲幅`));
    }

    if (showingStocks()) {
      const rows = visible();
      if (!rows.length) list_.append(h('div', 'empty', tab === 'watch' ? '清單是空的，輸入股票代號就能加入。'
        : tab === 'cross' ? (scanState && scanState.running ? '掃描中…' : '目前沒有符合的股票') : '這個分類目前沒有資料。'));
      rows.forEach(c => cardEl(c).forEach(el => list_.append(el)));
    }
    const g = curGroup();
    $('#more').hidden = !(tab && tab !== 'watch' && tab !== 'cross' && g && shown < g.codes.length);

    const live = isOpen();
    $('#status').classList.toggle('live', live);
    $('#mkt').textContent = live ? '盤中' : '非盤中';
    $('#upd').textContent = lastOk ? '更新 ' + clock(lastOk) : '';
    if (err) notice(err);
  }

  /* ---------- 抓資料 ---------- */
  let busy = null, again = false, timer = null;

  async function doFetch() {
    const codes = viewCodes();
    if (!showingStocks() || !codes.length) { render(); return; }
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 25000);
    try {
      const r = await fetch('/api/quotes', {
        method: 'POST', cache: 'no-store', signal: ctl.signal,
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({codes, pin: tab === 'watch'})
      });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || '發生錯誤');
      j.items.forEach(it => quotes[key(it.code)] = it);
      codes.forEach(c => missing.delete(key(c)));
      j.missing.forEach(c => missing.add(key(c)));
      lastOk = new Date();
      err = '';
      if ($('#notice').textContent.startsWith('連線')) notice('');
    } catch (e) {
      if (!/^https?:$/.test(location.protocol)) err = '連線失敗：這個畫面只是預覽，沒有連到後端。請用 Render 給的網址開啟。';
      else if (e.name === 'AbortError') err = '連線失敗：伺服器回應太慢，稍後自動重試';
      else if (e.name === 'SyntaxError') err = '連線失敗：伺服器回傳異常，稍後自動重試';
      else if (e.message === 'Load failed' || e.message === 'Failed to fetch') err = '連線失敗：連不上伺服器（免費版剛醒來要等約 1 分鐘），稍後自動重試';
      else err = '連線失敗：' + e.message + '，稍後自動重試';
    } finally { clearTimeout(to); }
    render();
    open.forEach(k => { if (getMode(k) === 'min5') ensureK5(k); });
  }

  async function pollScan() {
    clearTimeout(scanTimer);
    if (tab !== 'cross') return;
    try {
      const r = await fetch('/api/scan', {cache: 'no-store'});
      const j = await r.json();
      if (j.ok) {
        const was = scanState;
        scanState = j; scanErr = '';
        render();
        if (!j.running && (!was || was.running || was.updated !== j.updated)) refresh();
      }
    } catch (e) { scanErr = '掃描資料連線失敗，稍後重試'; render(); }
    scanTimer = setTimeout(pollScan, scanState && scanState.running ? 3000 : 20000);
  }

  function refresh() {
    if (busy) { again = true; return busy; }
    busy = doFetch().finally(() => {
      busy = null;
      if (again) { again = false; refresh(); } else schedule();
    });
    return busy;
  }
  function schedule() {
    clearTimeout(timer);
    const gap = !isOpen() ? 30000 : tab === 'watch' ? 5000 : 10000;
    timer = setTimeout(() => { if (document.hidden) schedule(); else refresh(); }, gap);
  }

  async function loadGroups(tries = 0) {
    try {
      const r = await fetch('/api/groups', {cache: 'no-store'});
      const j = await r.json();
      if (j.ok) {
        groups = {concept: j.concept, industry: j.industry, ready: j.ready};
        groupTries = tries;
        render();
        if (!j.ready && tries < 12) setTimeout(() => loadGroups(tries + 1), 10000);
        else if (j.ready) refresh();   // 產業與龍頭資料到了，重抓一次報價帶上標記
      }
    } catch (e) {
      if (tries < 4) setTimeout(() => loadGroups(tries + 1), 8000);
    }
  }

  /* ---------- 事件 ---------- */
  document.querySelectorAll('#bar button').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.tab;
    notice('');
    if (tab === t) {
      if (group) group = null;     // 在個股清單裡再點一次：回到上一層
      else tab = null;             // 在最上層再點一次：收起來
    } else { tab = t; group = null; }
    shown = PAGE;
    render(); window.scrollTo(0, 0); refresh();
    if (tab === 'cross') pollScan(); else clearTimeout(scanTimer);
  }));
  $('#add').addEventListener('submit', e => {
    e.preventDefault();
    let v = $('#code').value.trim();
    if (!v) return;
    if (['大盤', '加權', '加權指數', 'TAIEX'].includes(v.toUpperCase())) v = 't00';
    if (!/^[0-9A-Za-z]{1,8}$/.test(v)) { notice('代號只能是英數字，例如 2330'); return; }
    v = norm(v);
    $('#code').value = '';
    if (list.some(c => key(c) === key(v))) { notice(v + ' 已經在清單裡'); return; }
    notice('');
    list.push(v); saveList(); render(); refresh();
  });
  $('#more').addEventListener('click', () => { shown += PAGE; render(); });
  $('#status').addEventListener('click', () => refresh());
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

  render();
  loadGroups();
})();
</script>
</body>
</html>
